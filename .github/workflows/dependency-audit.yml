name: Dependency audit
on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/package.json'
      - 'tests/frontend/package.json'
      - 'src/desktop/package.json'
      - 'script/npm-audit-report.mjs'
      - 'tests/security/**'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for audit report parser
        run: node --test tests/security/*.test.mjs
      - name: Inventory vulnerabilities in all JS workspaces (diagnostic)
        run: node script/npm-audit-report.mjs
