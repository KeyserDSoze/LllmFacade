name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard
        working-directory: src/frontend
        run: npm install && npm run build
      - name: Frontend unit tests
        working-directory: tests/frontend
        run: npm install && npm run test:unit
      - name: Install Playwright Chromium
        working-directory: tests/frontend
        run: npx playwright install --with-deps chromium
      - name: Dashboard browser E2E (GitHub Pages base path)
        working-directory: tests/frontend
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Chrome extension tests and syntax
        run: |
          node --check src/extension/background.js
          node --check src/extension/security.js
          node --test tests/extension/*.test.cjs
      - name: Electron syntax
        run: |
          node --check src/desktop/main.cjs
          node --check src/desktop/preload.cjs
          node --check src/desktop/workspace.cjs
          node --check src/desktop/renderer/app.js
      - name: Desktop workspace unit tests
        run: node --test tests/desktop/*.test.cjs
      - name: Build admin SPA
        working-directory: src/admin
        run: npm install && npm run build
      - name: Admin unit tests
        working-directory: tests/admin
        run: npm install && npm run test:unit
      - name: Install Playwright Chromium for admin E2E
        working-directory: tests/admin
        run: npx playwright install --with-deps chromium
      - name: Admin browser E2E
        working-directory: tests/admin
        env:
          CI: 'true'
        run: npm run test:e2e
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Backend build
        run: dotnet build src/backend/LllmFacade.slnx -c Release
      - name: Business tests
        run: dotnet run --project tests/backend/LllmFacade.Business.Tests/LllmFacade.Business.Tests.csproj -c Release --no-build
      - name: Browser tests (headless Chromium against a simulated ChatGPT)
        run: dotnet run --project tests/backend/LllmFacade.Browser.Tests/LllmFacade.Browser.Tests.csproj -c Release --no-build
      - name: API tests (PostgreSQL via Testcontainers)
        run: dotnet run --project tests/backend/LllmFacade.Api.Tests/LllmFacade.Api.Tests.csproj -c Release --no-build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t lllmfacade-api .

