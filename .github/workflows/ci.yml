name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard
        working-directory: src/frontend
        run: npm install && npm run build
      - name: Frontend unit tests
        working-directory: tests/frontend
        run: npm install && npm run test:unit
      - name: Install Playwright Chromium
        working-directory: tests/frontend
        run: npx playwright install --with-deps chromium
      - name: Dashboard browser E2E (GitHub Pages base path)
        working-directory: tests/frontend
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Chrome extension tests and syntax
        run: |
          node --check src/extension/background.js
          node --check src/extension/security.js
          node --test tests/extension/*.test.cjs
      - name: Electron syntax
        run: |
          node --check src/desktop/main.cjs
          node --check src/desktop/preload.cjs
          node --check src/desktop/renderer/app.js
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Backend build
        run: dotnet build src/backend/LllmFacade.slnx -c Release
      - name: Backend tests
        run: dotnet run --project tests/backend/LllmFacade.Business.Tests/LllmFacade.Business.Tests.csproj -c Release

